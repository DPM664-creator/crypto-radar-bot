name: PrimeApe 7 - Crypto Radar

on:
  schedule:
    # Roda a cada 15 minutos
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Permite rodar manualmente

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Baixa todo o histórico
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Verificar arquivo de memória
        run: |
          echo "=== Conteúdo de sent_cas.json ==="
          if [ -f sent_cas.json ]; then
            cat sent_cas.json
          else
            echo "Arquivo não encontrado, criando..."
            echo '{"cas_enviados": []}' > sent_cas.json
          fi
          echo "=================================="
      
      - name: Rodar o bot PrimeApe 7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO_OWNER: ${{ secrets.REPO_OWNER }}
          REPO_NAME: ${{ secrets.REPO_NAME }}
        run: python main.py
