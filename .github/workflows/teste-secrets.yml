name: Teste Secrets GMGN

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Testar se secrets existem
      run: |
        echo "TESTE DE SECRETS GMGN"
        echo "========================="
        
        if [ -z "$GMGN_API_KEY" ]; then
          echo "GMGN_API_KEY: NAO ENCONTRADA"
        else
          echo "GMGN_API_KEY: ENCONTRADA"
          echo "Tamanho: ${#GMGN_API_KEY} caracteres"
        fi
        
        echo ""
        
        if [ -z "$GMGN_PRIVATE_KEY" ]; then
          echo "GMGN_PRIVATE_KEY: NAO ENCONTRADA"
        else
          echo "GMGN_PRIVATE_KEY: ENCONTRADA"
          echo "Tamanho: ${#GMGN_PRIVATE_KEY} caracteres"
        fi
        
        echo ""
        echo "========================="
        echo "OUTROS SECRETS:"
        
        if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
          echo "TELEGRAM_BOT_TOKEN: NAO ENCONTRADA"
        else
          echo "TELEGRAM_BOT_TOKEN: ENCONTRADA"
        fi
        
        if [ -z "$PAT_TOKEN" ]; then
          echo "PAT_TOKEN: NAO ENCONTRADA"
        else
          echo "PAT_TOKEN: ENCONTRADA"
        fi
      env:
        GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
        GMGN_PRIVATE_KEY: ${{ secrets.GMGN_PRIVATE_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
